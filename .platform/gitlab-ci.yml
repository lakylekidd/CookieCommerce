  image: python:3.14-alpine
  rules:
  - if: $CI_COMMIT_TAG
    when: on_success
  needs:
  - job: platform_build_authentication_management_api
    artifacts: true
  - job: platform_build_customer_api
    artifacts: true
  - job: platform_build_infra_keycloak
    artifacts: true
  - job: platform_build_product_api
    artifacts: true
  - job: platform_build_web
    artifacts: true
  script:
  - python .platform/ci/release.py collect
  artifacts:
    paths:
    - release/release.json
    expire_in: 1 year
