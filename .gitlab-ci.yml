image: mcr.microsoft.com/dotnet/sdk:10.0

include:
  - local: .platform/gitlab-ci.yml

stages:
  - release-check
  - verify-build
  - test
  - build
  - package

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  SOLUTION_PATH: "src/CookieCommerce.slnx"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  GIT_DEPTH: "0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

.dotnet_setup:
  before_script:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - node --version
  - npm --version
  - cd src/CookieCommerce.Web
  - npm ci
  - cd ../..
  - dotnet --info
  - dotnet restore "$SOLUTION_PATH"

build_solution:
  extends: .dotnet_setup
  stage: verify-build
  script:
    - dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

run_tests:
  extends: .dotnet_setup
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - dotnet test "$SOLUTION_PATH" --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/

# The generated job uses the existing Node build and Docker-backed tests.
# Existing compiler/package warnings are reported, but are not a release gate.
platform_verify:
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - cd src/CookieCommerce.Web
    - npm ci
    - cd ../..
  script:
    - dotnet restore "$PLATFORM_SOLUTION"
    - dotnet build "$PLATFORM_SOLUTION" --no-restore -c Release
    - dotnet test "$PLATFORM_SOLUTION" --no-build --no-restore -c Release
