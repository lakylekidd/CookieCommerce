# Managed by homelab-platform; review through Git before execution.
stages:
- release-check
- test
- build
- package
workflow:
  rules:
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
    when: never
  - if: $CI_COMMIT_BRANCH
platform_verify:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    PLATFORM_SOLUTION: src/CookieCommerce.slnx
  script:
  - dotnet restore "$PLATFORM_SOLUTION"
  - dotnet build "$PLATFORM_SOLUTION" --no-restore -c Release -warnaserror
  - dotnet test "$PLATFORM_SOLUTION" --no-build --no-restore -c Release
platform_validate_release:
  stage: release-check
  image: python:3.14-alpine
  rules:
  - if: $CI_COMMIT_TAG
    when: on_success
  script:
  - python .platform/ci/release.py validate
platform_build_authentication_management_api:
  stage: build
  image:
    name: moby/buildkit:v0.34.0-rootless
    entrypoint:
    - ''
  rules:
  - if: $CI_COMMIT_TAG
    when: on_success
  needs:
  - job: platform_verify
  - job: platform_validate_release
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
    PLATFORM_SERVICE: authentication-management-api
    PLATFORM_DOCKERFILE: src/CookieCommerce.AuthenticationManagement.Api/Dockerfile
    PLATFORM_BUILD_CONTEXT: .
    PLATFORM_PROJECT_PATH: engineering/tiger-van-cookie
    PLATFORM_REGISTRY_HOST: git.registry.vlachos.nl
    PLATFORM_REGISTRY_PREFIX: git.registry.vlachos.nl/engineering/tiger-van-cookie
  resource_group: platform-image-$CI_COMMIT_TAG-authentication-management-api
  script:
  - sh .platform/ci/build-image.sh
  artifacts:
    paths:
    - release/authentication-management-api.json
    - release/authentication-management-api.buildkit.json
    expire_in: 1 year
