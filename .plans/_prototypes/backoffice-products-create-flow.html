<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Products Create Flow</title>
<style>
  body{margin:0;background:#faf7f2;color:#292524;font-family:Inter,ui-sans-serif,system-ui,sans-serif;padding:32px}.wrap{max-width:980px;margin:auto}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.btn{border:2px solid #f97316;color:#f97316;background:white;border-radius:18px;padding:14px 22px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.btn.loading{background:#f97316;color:white}.spinner{display:inline-block;width:14px;height:14px;border:3px solid rgba(255,255,255,.45);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}.card{background:white;border:1px solid #eee7df;border-radius:24px;overflow:hidden;box-shadow:0 12px 30px rgba(67,20,7,.08)}table{width:100%;border-collapse:collapse}th{background:#fbfaf8;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#78716c;padding:18px 24px}td{padding:20px 24px;border-top:1px solid #f2ede8}.product{display:flex;align-items:center;gap:14px}.avatar{width:42px;height:42px;border-radius:50%;background:#ffedd5;display:grid;place-items:center}.stock{display:inline-flex;gap:8px;align-items:center;background:#f5f5f4;border:1px solid #e7e5e4;border-radius:999px;padding:7px 12px;font-weight:900}.dot{width:8px;height:8px;border-radius:50%;background:#10b981}.zero .dot{background:#f97316}.status{font-size:11px;font-weight:900;text-transform:uppercase;color:#16a34a}.draft{color:#a8a29e}.new{background:#fff7ed}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Products</h1><button class="btn loading"><span class="spinner"></span>Create Product</button></div>
  <div class="card"><table><thead><tr><th>Product</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>
    <tr><td><div class="product"><div class="avatar">🍪</div><div><strong>Chocolate Chunk</strong><br><small>COOKIE-001</small></div></div></td><td><span class="stock"><span class="dot"></span>124 Qty</span></td><td><span class="status">Live</span></td><td>›</td></tr>
    <tr><td><div class="product"><div class="avatar">🍵</div><div><strong>Matcha White Chocolate</strong><br><small>COOKIE-002</small></div></div></td><td><span class="stock"><span class="dot"></span>72 Qty</span></td><td><span class="status">Live</span></td><td>›</td></tr>
    <tr class="new"><td><div class="product"><div class="avatar">🐯</div><div><strong>New Tiger Bite</strong><br><small>COOKIE-NEW</small></div></div></td><td><span class="stock zero"><span class="dot"></span>0 Qty</span></td><td><span class="status draft">Draft</span></td><td>›</td></tr>
  </tbody></table></div>
</div>
</body>
</html>
