image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - build
  - test
  - release_staging
  - release_production

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  SOLUTION_PATH: "src/CookieCommerce.slnx"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"
  GIT_DEPTH: "0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages/

before_script:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - node --version
  - npm --version
  - cd src/CookieCommerce.Web
  - npm ci
  - cd ../..
  - dotnet --info
  - dotnet restore "$SOLUTION_PATH"

build_solution:
  stage: build
  script:
    - dotnet build "$SOLUTION_PATH" --configuration Release --no-restore

run_tests:
  stage: test
  services:
    - name: docker:27-dind
      alias: docker
  script:
    - dotnet test "$SOLUTION_PATH" --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
  artifacts:
    when: always
    paths:
      - TestResults/

.release_template:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  needs:
    - build_solution
    - run_tests
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - apk add --no-cache git
    - export GIT_TAG="${CI_COMMIT_TAG:-$(git describe --tags --abbrev=0)}"
    - export IMAGE_TAG="${GIT_TAG}${IMAGE_TAG_SUFFIX}"
    - docker build --pull -f "$DOCKERFILE_PATH" -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$LATEST_TAG" .
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$LATEST_TAG"

release_authentication_management_staging:
  extends: .release_template
  stage: release_staging
  variables:
    IMAGE_NAME: "authentication-management"
    IMAGE_TAG_SUFFIX: "-staging"
    LATEST_TAG: "staging"
    DOCKERFILE_PATH: "src/CookieCommerce.AuthenticationManagement.Api/Dockerfile"
  environment:
    name: staging/authentication-management
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - src/CookieCommerce.AuthenticationManagement.Api/**/*
        - src/CookieCommerce.AuthenticationManagement.Application/**/*
        - src/CookieCommerce.AuthenticationManagement.Domain/**/*
        - src/CookieCommerce.AuthenticationManagement.Infrastructure/**/*
    - when: never

release_authentication_management_production:
  extends: .release_template
  stage: release_production
  variables:
    IMAGE_NAME: "authentication-management"
    IMAGE_TAG_SUFFIX: ""
    LATEST_TAG: "latest"
    DOCKERFILE_PATH: "src/CookieCommerce.AuthenticationManagement.Api/Dockerfile"
  environment:
    name: production/authentication-management
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - src/CookieCommerce.AuthenticationManagement.Api/**/*
        - src/CookieCommerce.AuthenticationManagement.Application/**/*
        - src/CookieCommerce.AuthenticationManagement.Domain/**/*
        - src/CookieCommerce.AuthenticationManagement.Infrastructure/**/*
      when: manual
    - when: never

release_web_domain_staging:
  extends: .release_template
  stage: release_staging
  variables:
    IMAGE_NAME: "web"
    IMAGE_TAG_SUFFIX: "-staging"
    LATEST_TAG: "staging"
    DOCKERFILE_PATH: "src/CookieCommerce.Web/Dockerfile"
  environment:
    name: staging/web
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - src/CookieCommerce.Web/**/*
    - when: never

release_web_domain_production:
  extends: .release_template
  stage: release_production
  variables:
    IMAGE_NAME: "web"
    IMAGE_TAG_SUFFIX: ""
    LATEST_TAG: "latest"
    DOCKERFILE_PATH: "src/CookieCommerce.Web/Dockerfile"
  environment:
    name: production/web
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - src/CookieCommerce.Web/**/*
      when: manual
    - when: never
