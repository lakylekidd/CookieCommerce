name: Dockerize and Depoy CookieCommerce.Web
on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/CookieCommerce.Web/**'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/CookieCommerce.Web/Dockerfile        
        push: true
        tags: ghcr.io/${{ github.repository_owner}}/cookiecommerce-web:latest

    - name: Trigger Portainer Webhook
      run: |
        curl -X POST "{{ secrets.PORTAINER_WEBHOOK_URL }}"
