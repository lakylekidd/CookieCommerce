name: Dockerize CookieCommerce.Web

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/CookieCommerce.Web/**'
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: src/CookieCommerce.Web/Dockerfile        
        push: true
        tags: ghcr.io/cookiecommerce-web:latest
